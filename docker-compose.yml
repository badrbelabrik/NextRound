services:

  backend:
    build:
      context: ./NextRound-backend
      dockerfile: Dockerfile

    container_name: nextround-backend

    ports:
      - "8000:80"

    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000

      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: next_round
      DB_USERNAME: nextround
      DB_PASSWORD: nextround

    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./NextRound-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: /api

    container_name: nextround-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

  db:
    image: mysql:8.4

    container_name: nextround-db

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: next_round
      MYSQL_USER: nextround
      MYSQL_PASSWORD: nextround
      MYSQL_ROOT_PASSWORD: root

    ports:
      - "3308:3306"

    volumes:
      - nextround_db_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD",
          "mysqladmin",
          "ping",
          "-h",
          "localhost",
          "-u",
          "root",
          "-proot"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


volumes:
  nextround_db_data: